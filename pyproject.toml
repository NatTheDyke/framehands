[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "framehands"
version = "0.2.4"
description = "Steam Frame hand tracking: camera frames, Mercury detection and keypoints, temporal tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless", "framenpu>=0.2,<0.5"]

[project.optional-dependencies]
mediapipe = ["mediapipe"]  # framehands.detect, the legacy detector

[project.urls]
Source = "https://github.com/NatTheDyke/framehands"

# cpp/ builds framehands._core, so a wheel is for one interpreter and platform (cp314-cp314-linux_aarch64)
[tool.scikit-build]
minimum-version = "0.11"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
install.components = ["python"]
wheel.packages = ["framehands"]
