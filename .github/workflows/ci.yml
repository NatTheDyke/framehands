name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # framenpu 0.4.0 (the newest release this framehands' dependency range allows) and its device
  # backend framenpu-cdsp 0.1.0, by commit
  FRAMENPU_SHA: a8f344ed7fca57ce890ad90276e36d1bde31ebbe
  FRAMENPU_CDSP_SHA: 80ba356fd3c9d55fbf74b46621cd0b0865686060
  FRAMENPU: git+https://github.com/NatTheDyke/framenpu@a8f344ed7fca57ce890ad90276e36d1bde31ebbe

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (framenpu at its pinned commit)
        run: python -m pip install "framenpu @ $FRAMENPU" -e . pybind11
      - name: Build the C++ core
        run: python tools/build_core.py
      - name: Runner CPU
        run: python -c "from numpy._core._multiarray_umath import __cpu_features__ as f; print('::notice title=CPU::' + (' '.join(k for k, v in f.items() if v and 'AVX512' in k) or 'no AVX-512'))"
      - name: Tests
        # the C++ core matches the Python reference bit for bit on a given machine, but GitHub's runner
        # CPUs differ in numpy's BLAS kernel and in the last bit of arctan2 & co: compare within 1e-12
        env:
          FRAMEHANDS_CORE_EXACT: "0"
        # failures also become annotations, which are readable without signing in to GitHub
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log || {
            awk '/^(FAIL|ERROR): /{t=$0} /^[A-Za-z.]*(Error|Exception): /{print "::error title=" t "::" $0}' test.log
            exit 1
          }
      - name: The wheel carries the built core
        run: |
          python -m pip wheel --no-deps -w dist .
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(n.startswith('framehands/_core') for n in names), names"

  device-path:
    # the keypoint path on framenpu's device backend, with framenpu-cdsp's simulated plugin (no DSP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NatTheDyke/framenpu
          ref: ${{ env.FRAMENPU_SHA }}
          path: _framenpu
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NatTheDyke/framenpu-cdsp
          ref: ${{ env.FRAMENPU_CDSP_SHA }}
          path: _cdsp
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install (framenpu-cdsp from the same commit as its simulated plugin)
        run: python -m pip install "./_framenpu[cpu]" ./_cdsp -e .
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: models
          key: models-${{ env.FRAMENPU_SHA }}
      - name: Fetch the models by hash
        run: python _framenpu/tools/fetch_models.py models --only mercury-keypoint-jan18 mercury-ft7
      - name: Device path, Mercury and the ft7 student
        env:
          FRAMENPU_DEVICES: cdsp=sim_plugin:SimPlugin
          PYTHONPATH: ${{ github.workspace }}/_cdsp/tests
          FNPU_MERCURY_JOBS: ${{ github.workspace }}/_cdsp/src/framenpu_cdsp/data/mercury
        run: |
          for m in grayscale_keypoint_jan18 student_ft7; do
            FNPU_MERCURY_MODEL=$PWD/models/$m.onnx python -m unittest discover -s tests -p test_device_path.py -v
          done
