name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # framenpu 0.2.0 (the release this framehands' dependency range allows), by commit
  FRAMENPU: git+https://github.com/NatTheDyke/framenpu@d820e73d34d8c08428e6ad6dfb0a138073449fa6

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (framenpu at its pinned commit)
        run: python -m pip install "framenpu @ $FRAMENPU" -e . pybind11
      - name: Build the C++ core
        run: python tools/build_core.py
      - name: Runner CPU
        run: python -c "from numpy._core._multiarray_umath import __cpu_features__ as f; print('::notice title=CPU::' + (' '.join(k for k, v in f.items() if v and 'AVX512' in k) or 'no AVX-512'))"
      - name: Tests
        # the core's exactness tests hold numpy's OpenBLAS to its Haswell kernel (what a non-AVX-512
        # x86-64 machine runs); on AVX-512 runners it picks SkylakeX, which fuses multiply-adds differently
        env:
          OPENBLAS_CORETYPE: Haswell
        # failures also become annotations, which are readable without signing in to GitHub
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log || {
            awk '/^(FAIL|ERROR): /{t=$0} /^[A-Za-z.]*(Error|Exception): /{print "::error title=" t "::" $0}' test.log
            exit 1
          }
      - name: The wheel carries the built core
        run: |
          python -m pip wheel --no-deps -w dist .
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(n.startswith('framehands/_core') for n in names), names"
