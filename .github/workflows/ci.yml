name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # framenpu 0.4.2 (the newest release this framehands' dependency range allows) and its device
  # backend framenpu-cdsp 0.1.2, by commit
  FRAMENPU_SHA: 4f2a2b4077872f80b74b77e1c7fc07e779214f90
  FRAMENPU_CDSP_SHA: 5cac3bd0074a498d872fd8452213ec7a9b75c115
  FRAMENPU: git+https://github.com/NatTheDyke/framenpu@4f2a2b4077872f80b74b77e1c7fc07e779214f90

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-24.04-arm  # the headset's platform
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (framenpu at its pinned commit)
        run: python -m pip install "framenpu @ $FRAMENPU" -e .
      - name: The C++ core is built (its tests skip without it)
        run: python -c "from framehands import _core; print(_core.__file__)"
      - name: Runner CPU
        run: python -c "from numpy._core._multiarray_umath import __cpu_features__ as f; print('::notice title=CPU::' + (' '.join(k for k, v in f.items() if v and 'AVX512' in k) or 'no AVX-512'))"
      - name: Tests
        # the C++ core matches the Python reference bit for bit on a given machine, but GitHub's runner
        # CPUs differ in numpy's BLAS kernel and in the last bit of arctan2 & co: compare within 1e-12
        env:
          FRAMEHANDS_CORE_EXACT: "0"
        # failures also become annotations, which are readable without signing in to GitHub
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log || {
            awk '/^(FAIL|ERROR): /{t=$0} /^[A-Za-z.]*(Error|Exception): /{print "::error title=" t "::" $0}' test.log
            exit 1
          }
      - name: The wheel carries the core, is tagged for this platform, and runs outside the tree
        run: |
          python -m pip wheel --no-deps -w dist .
          python - <<'EOF'
          import glob, sysconfig, zipfile
          path, = glob.glob("dist/*.whl")
          z = zipfile.ZipFile(path)
          cores = [n for n in z.namelist() if "_core" in n]
          assert cores == ["framehands/_core" + sysconfig.get_config_var("EXT_SUFFIX")], cores
          wheel = z.read(next(n for n in z.namelist() if n.endswith("/WHEEL"))).decode()
          tag = "cp%s-cp%s-%s" % ((sysconfig.get_config_var("py_version_nodot"),) * 2
                                  + (sysconfig.get_platform().replace("-", "_").replace(".", "_"),))
          assert "Root-Is-Purelib: false" in wheel and "Tag: " + tag in wheel, wheel
          EOF
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install "framenpu @ $FRAMENPU" dist/*.whl
          cd "$RUNNER_TEMP" && FRAMEHANDS_CORE=native wheel/bin/python -c "from framehands import _native, merctrack; print(_native.core.__file__)"

  device-path:
    # the keypoint path on framenpu's device backend, with framenpu-cdsp's simulated plugin (no DSP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NatTheDyke/framenpu
          ref: ${{ env.FRAMENPU_SHA }}
          path: _framenpu
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NatTheDyke/framenpu-cdsp
          ref: ${{ env.FRAMENPU_CDSP_SHA }}
          path: _cdsp
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install (framenpu-cdsp from the same commit as its simulated plugin)
        run: python -m pip install "./_framenpu[cpu]" ./_cdsp -e .
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: models
          key: models-${{ env.FRAMENPU_SHA }}
      - name: Fetch the models by hash
        run: python _framenpu/tools/fetch_models.py models --only mercury-keypoint-jan18 mercury-ft7
      - name: Device path, Mercury and the ft7 student
        env:
          FRAMENPU_DEVICES: cdsp=sim_plugin:SimPlugin
          PYTHONPATH: ${{ github.workspace }}/_cdsp/tests
          FNPU_MERCURY_JOBS: ${{ github.workspace }}/_cdsp/src/framenpu_cdsp/data/mercury
        run: |
          for m in grayscale_keypoint_jan18 student_ft7; do
            FNPU_MERCURY_MODEL=$PWD/models/$m.onnx python -m unittest discover -s tests -p test_device_path.py -v
          done
